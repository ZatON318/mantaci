<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HTML boilerplate website" />
  <title>Boilerplate Website</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="#" class="logo">Site</a>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>HTML Boilerplate</h1>
      <p>A clean starter template. Edit <code>index.html</code>, <code>styles.css</code>, and <code>script.js</code> to begin.</p>
      <button id="cta-btn">Click me</button>
      <p id="message" aria-live="polite"></p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>This section is placeholder content for your site.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name" />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Boilerplate Website. All rights reserved.</p>
  </footer>
</body>
</html>
